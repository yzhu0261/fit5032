
name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yzhu-library-w4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yzhu-library-w4/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: yzhu-library-w4/dist
